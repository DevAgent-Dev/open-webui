services:
  ollama:
    volumes:
      - ollama:/root/.ollama
    container_name: ollama
    pull_policy: always
    tty: true
    restart: unless-stopped
    image: ollama/ollama:${OLLAMA_DOCKER_TAG-latest}
    gpus: all
    environment:
      - 'OLLAMA_KEEP_ALIVE=${OLLAMA_KEEP_ALIVE--1}'
      - 'OLLAMA_NUM_PARALLEL=${OLLAMA_NUM_PARALLEL-2}'
      - 'OLLAMA_CONTEXT_LENGTH=${OLLAMA_CONTEXT_LENGTH-4096}'
      - 'OLLAMA_FLASH_ATTENTION=${OLLAMA_FLASH_ATTENTION-1}'
      - 'OLLAMA_KV_CACHE_TYPE=${OLLAMA_KV_CACHE_TYPE-q8_0}'
      - 'OLLAMA_MAX_LOADED_MODELS=${OLLAMA_MAX_LOADED_MODELS-2}'
      - 'OLLAMA_MAX_QUEUE=${OLLAMA_MAX_QUEUE-32}'

  open-webui:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/open-webui/open-webui:${WEBUI_DOCKER_TAG-main}
    container_name: open-webui
    volumes:
      - open-webui:/app/backend/data
    depends_on:
      - ollama
    ports:
      - ${OPEN_WEBUI_PORT-3000}:8080
    environment:
      - 'OLLAMA_BASE_URL=http://ollama:11434'
      - 'WEBUI_SECRET_KEY='
      - 'WEBUI_URL=${WEBUI_URL-https://chat.devagent.dev}'
      - 'ENABLE_OAUTH_PERSISTENT_CONFIG=True'
      - 'ENABLE_OAUTH=True'
      - 'ENABLE_OAUTH_SIGNUP=True'
      - 'OAUTH_PROVIDER_NAME=DevAgent'
      - 'OPENID_PROVIDER_URL=https://auth.devagent.dev/realms/devagent/.well-known/openid-configuration'
      - 'OAUTH_CLIENT_ID=${OAUTH_CLIENT_ID-chat-ui}'
      - 'OAUTH_CLIENT_SECRET=${OAUTH_CLIENT_SECRET-}'
      - 'OPENID_REDIRECT_URI=${OPENID_REDIRECT_URI-https://chat.devagent.dev/oauth/oidc/login/callback}'
      - 'OAUTH_SCOPES=openid email profile'
    extra_hosts:
      - host.docker.internal:host-gateway
    restart: unless-stopped

volumes:
  ollama: {}
  open-webui: {}
